<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 120" width="764" height="120" role="img" aria-label="AVZERA">
  <defs>
    <!-- Letter A with 3D pyramid, recoloured to the site's ink + gold palette -->
    <g id="letterA">
      <path d="M0,120 L42,0 L78,0 L120,120 L89,120 L59,34 L31,120 Z" fill="#1c1a17"/>
      <polygon points="60,65 41,120 60,120" fill="#d6a656"/>
      <polygon points="60,65 60,120 79,120" fill="#8a5d18"/>
    </g>

    <!-- Letter V -->
    <g id="letterV">
      <path d="M0,0 L31,0 L60,86 L89,0 L120,0 L78,120 L42,120 Z" fill="#1c1a17"/>
    </g>

    <!-- Letter Z with 3D ribbon fold -->
    <g id="letterZ">
      <polygon points="5,0 108,0 108,25 5,25" fill="#8a5d18"/>
      <polygon points="108,25 24,95 0,95 72,25" fill="#8a5d18"/>
      <polygon points="72,25 108,25 60,95 24,95" fill="#d6a656"/>
      <polygon points="0,94 108,94 108,120 0,120" fill="#8a5d18"/>
    </g>

    <!-- Letter E -->
    <g id="letterE">
      <rect x="0" y="0" width="30" height="120" fill="#1c1a17"/>
      <rect x="30" y="0" width="60" height="24" fill="#1c1a17"/>
      <rect x="30" y="48" width="51" height="24" fill="#1c1a17"/>
      <rect x="30" y="94" width="64" height="26" fill="#1c1a17"/>
    </g>

    <!-- Letter R -->
    <g id="letterR">
      <rect x="0" y="0" width="30" height="120" fill="#1c1a17"/>
      <path d="M30,0 L68,0 C93,0 108,13 108,34 C108,55 93,68 68,68 L30,68 Z M30,22 L65,22 C78,22 83,27 83,34 C83,41 78,46 65,46 L30,46 Z" fill="#1c1a17" fill-rule="evenodd"/>
      <polygon points="54,68 84,68 109,120 78,120" fill="#1c1a17"/>
    </g>
  </defs>

  <g transform="translate(0, 0)">
    <use href="#letterA" x="0" y="0"/>
    <use href="#letterV" x="136" y="0"/>
    <use href="#letterZ" x="270" y="0"/>
    <use href="#letterE" x="404" y="0"/>
    <use href="#letterR" x="523" y="0"/>
    <use href="#letterA" x="644" y="0"/>
  </g>
</svg>
