      <rect x="30" y="0" width="60" height="24" fill="#ffffff"/>
      <rect x="30" y="48" width="51" height="24" fill="#ffffff"/>
      <rect x="30" y="94" width="64" height="26" fill="#ffffff"/>
    </g>

