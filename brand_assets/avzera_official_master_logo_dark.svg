      <path d="M30,0 L68,0 C93,0 108,13 108,34 C108,55 93,68 68,68 L30,68 Z M30,22 L65,22 C78,22 83,27 83,34 C83,41 78,46 65,46 L30,46 Z" fill="#ffffff" fill-rule="evenodd"/>
      <polygon points="54,68 84,68 109,120 78,120" fill="#ffffff"/>
    </g>
    
  </defs>
  <g transform="translate(130, 70)">
    
    <use href="#letterA" x="0" y="0"/>
    <use href="#letterV" x="136" y="0"/>
    <use href="#letterZ" x="270" y="0"/>
    <use href="#letterE" x="404" y="0"/>
    <use href="#letterR" x="523" y="0"/>
    <use href="#letterA" x="644" y="0"/>
    
  </g>
  
