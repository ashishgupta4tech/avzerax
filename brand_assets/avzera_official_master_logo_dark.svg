<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 335" width="1024" height="335">
  <rect width="100%" height="100%" fill="#08152c" rx="16"/>
  <defs>
    
    <!-- Master Letter A with 3D Pyramid -->
    <g id="letterA">
